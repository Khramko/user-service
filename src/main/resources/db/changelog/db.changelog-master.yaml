databaseChangeLog:
  - changeSet:
      id: 1
      author: andrey
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 2
      author: andrey
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
        - sql:
            sql: UPDATE users SET password = '$2a$10$dummyHashPlaceholderForExistingUsers000000000000000000' WHERE password IS NULL
        - addNotNullConstraint:
            tableName: users
            columnName: password
            columnDataType: VARCHAR(255)