apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-service
  namespace: health-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /health
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: health-service
                port:
                  number: 8000
          - path: /otusapp/.*/health
            pathType: ImplementationSpecific
            backend:
              service:
                name: health-service
                port:
                  number: 8000