apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-service
  namespace: user-service
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8000
          - path: /otusapp/.*/health
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 8000
                    - path: /api/profile
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8000
          - path: /api/profile/.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 8000
- path: /auth/.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 8000