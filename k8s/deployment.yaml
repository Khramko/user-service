apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service
  namespace: health-service
  labels:
    app: health-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: health-service
    spec:
      containers:
        - name: health-servi
          image: andrey7x7/service-health:0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 50
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 50
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"          # Увеличено
              cpu: "250m"
            limits:
              memory: "1Gi"            # Увеличено
              cpu: "500m"