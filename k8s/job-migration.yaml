apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: health-service
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
spec:
  ttlSecondsAfterFinished: 100
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: andrey7x7/service-health:0.0.2
          # ГЛАВНОЕ ИЗМЕНЕНИЕ - запускаем только миграции и выходим
          command:
            - "java"
            - "-jar"
            - "app.jar"
            - "--spring.liquibase.enabled=true"
            - "--spring.batch.job.enabled=false"
            - "--spring.main.web-application-type=none"
            - "--spring.job.enabled=false"
            - "--spring.sql.init.mode=never"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD